[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-tabular"
version = "1.1.2"
description = "FDE: Fast-Deployment Ensemble for imbalanced tabular classification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dwi Sunaryono" }, { name = "Misbakhul Munir Irfan Subakti" }, { name = "Laras Suciningtyas" },
           { name = "Irzal Ahmad Sabilla" }, { name = "Muchamad Kurniawan" }]
requires-python = ">=3.10"
keywords = ["ensemble learning", "class imbalance", "tabular data", "classification", "stacking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "optuna>=3.6",
    "joblib>=1.4",
    "threadpoolctl>=3.1",
    "torch>=2.1",
    "psutil>=5.9",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/DwiSunaryono/fde-tabular"
Repository = "https://github.com/DwiSunaryono/fde-tabular"
Issues = "https://github.com/DwiSunaryono/fde-tabular/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fde = "fde.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
